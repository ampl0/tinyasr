plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.tinyasr.app'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId "dev.tinyasr.app"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "2.1"

        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // "core" ships no models (import them from storage); "full" bundles the packs.
    flavorDimensions 'bundle'
    productFlavors {
        core {
            dimension 'bundle'
            applicationIdSuffix '.core'
            versionNameSuffix '-core'
        }
        full {
            dimension 'bundle'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Keep the model packs uncompressed: one less decompression pass on first run.
    androidResources {
        noCompress 'tzf', 'bin', 'onnx'
    }

    packaging {
        jniLibs {
            // Extract libtinyasr_jni.so to the lib dir; System.loadLibrary finds it there.
            useLegacyPackaging = true
        }
    }
}
