name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      # Builds the tinyasr engine for arm64 from its pinned revision and stages
      # the static library, the header and the model packs for the "full" flavor.
      - name: Build the engine
        run: |
          rustup target add aarch64-linux-android
          scripts/build-engine.sh

      - name: Check layouts
        run: scripts/check-layout.sh

      - name: Assemble debug APKs
        run: gradle assembleCoreDebug assembleFullDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tinyasr-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
